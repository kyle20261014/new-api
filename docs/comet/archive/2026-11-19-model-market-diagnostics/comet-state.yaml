纹/智力/绘画四项状态和技术报告；删除赞踩、赞并路由、禁用、固定商家、加入路由及绘画复测入口，保留开始检测、复制、下载、素材、提示词、规则与自由创作；浅暗色、窄屏、键盘和滚动内容可用，切换/刷新/查看不触发收费。"},{"id":"A2","source":"brief.md","text":"标准报告按授权模型与分组、参数和版本共享，自由创作私有；所有读写和进度接口服务端复核当前权限，隐藏内部渠道、密钥、会话和发起者身份，实际扣费仅本人可见，旁观者不能操作他人任务。"},{"id":"A3","source":"brief.md","text":"检测为后端持久化异步任务，关闭弹窗或前端断线后继续，重开显示真实进度；每个未发送步骤复核用户、会话和模型分组权限，注销撤权停后续发送，已在途按原计费规则处理；不同任务独立推进，不增加全站四请求上限或整轮串行。"},{"id":"A4","source":"brief.md","text":"正常中继及现有预扣结算退款被复用，不开放管理员测试接口、不复制额度算法；重复提交/运行中共享任务不重复发送预扣；发送前持久化步骤与真实资金身份关联，重启结果不明步骤待核查且不重发，执行结果与费用结清分开；开始前提示生成实际用量收费，本地判分无额外模型调用。"},{"id":"A5","source":"brief.md","text":"通联仅对支持对话接口的模型正常发送一个简短请求，前后端均拦截不适用模型；成功失败、耗时及用量真实，缺失显示未知，不冒充能力或身份认证。"},{"id":"A6","source":"brief.md","text":"指纹用固定版本lm-detector三挑战经本站正常中继采样再本地分析，固定本地可合法分发的数据及摘要，保留MIT声明、样本和版本；不足样本/实际来源不一致/缺库/校验失败不伪造完整排名或置信度，不隐式下载更新或追加采样；库内相似性不冒充官方身份认证。"},{"id":"A7","source":"brief.md","text":"智力采用固定MIT dsh-model-probe十八原题、答案、权重总36并保留声明，逐题正常中继、本地判分；修正重量题否定假阳性、代码外形误判和失败缩分母，失败显示未完成且不整轮通过；只有全部完成按原权重展示完整分，拟采用70分门槛，不造旗舰档位排名，记录真实回答、依据和判分版本。"},{"id":"A8","source":"brief.md","text":"绘画每次只生成一份HTML内联SVG作品，支持JS隔离预览与原代码复制下载；固定题采用已取证鹈鹕骑自行车完整提示词，自由创作保存本次实际素材与提示词且仅本人可见；原素材全集未公开，改编部分明确标注，不携带本站身份、同源或外部资源权限，不增图片生成或额外判分模型调用。"},{"id":"A9","source":"brief.md","text":"绘画按目标Spec第7节定义可复现静态指标及参考结构权重和外链/占位/未闭合扣分，图元15/6、路径5、颜色4/2、体积4096/1500字节边界准确；阶梯不累加，先加减再clamp到0至100，未知不当零或完整分，声明不冒充实际画质。"},{"id":"A10","source":"brief.md","text":"绘画只做单次本地异常判定：完整响应明确缺少或未闭合SVG、明确未完成占位、明确缺动画，或图元<6且颜色<2且体积<1500字节同时满足，标本次结构异常并列原因；多个原因扣一次30分，不依据历史/复测；标准与自由创作共同结构要求均适用，动态不支持为无法判定，API超时截断为未完成，未知不扣15分、不造概率或模型正常结论；完整分>=70且未发现异常才结构通过。"},{"id":"A11","source":"brief.md","text":"单次绘画没有待复测、两轮确认、连续异常、同向累计、历史比较扣分或自动追加生成；原有中继传输重试不作为新证据；报告说明结构方法不能判断动物题意、美学、自然动作或真实模型身份，不声称复现原站概率。"},{"id":"A12","source":"brief.md","text":"技术报告完整展示各项真实状态、时间、来源限制、样本/题目/作品、规则版本、可获得用量及逐项原因；无数据不造零分或通过，24小时或已知配置版本变化标旧保留历史，不自动收费更新；报告成功与费用待核对可分别显示。"},{"id":"A13","source":"brief.md","text":"七语言使用现有国际化与格式化，业务API及新mowan_表沿现有权限审计限流迁移机制并兼容SQLite/MySQL/PostgreSQL；保持单个紧密关联Comet及dev独立worktree、组长正式