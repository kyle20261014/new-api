:[{"id":"A1","source":"brief.md","text":"A1：钱包原入口展示允许销售的固定套餐和支付方式，选套餐不创建订单，点击继续才创建 quantity=1 的单SKU订单；测试SKU不可售，未配置/不可用有明确提示，其他支付方式行为保持兼容。"},{"id":"A2","source":"brief.md","text":"A2：确认框分别展示服务端快照的套餐售价USD、到账额度以及渠道返回的实付金额/币种；不重复应用通用折扣/汇率，未知费用或空值不显示为已确定实付。"},{"id":"A3","source":"brief.md","text":"A3：确认付款后保存原订单标识并同页前往经校验的官方支付URL；回跳恢复对应订单；无链接、非法URL和获取链接失败保留订单并提示重试，不创建替代订单。"},{"id":"A4","source":"brief.md","text":"A4：回站、刷新、重新进入钱包和重新聚焦时自动查询当前账户的待确认订单；查询有限重试，成功后刷新余额和历史记录；退出/切换账户不展示或查询前一账户订单。"},{"id":"A5","source":"brief.md","text":"A5：查询错误/超时与正常待支付状态分开显示；保留原订单及上次已确认状态，自动轮询结束提供手动查询，不能将上述事件直接标为失败、未付款或过期。"},{"id":"A6","source":"brief.md","text":"A6：历史订单可恢复原订单；继续付款前服务端查验用户归属、NEW状态和渠道可用性，再取得支付链接；DONE/REFUND/EXPIRED不可继续付，原链接失效不自动再建单。"},{"id":"A7","source":"brief.md","text":"A7：仅上游确认EXPIRED才展示过期并允许用户主动重新下单；尚无退款处理记录时，迟到DONE经完整核验可一次入账。REFUND在未入账时阻止后续入账；已入账时余额足够一次全额扣回，不足则不部分扣回、不透支并转manual_required；重复REFUND及任何已处理退款后迟到DONE均不再改变余额，manual_required不自动重扣；数据库失败整体回滚可重试。仅接收平台退款，不新增用户发起退款入口。"},{"id":"A8","source":"brief.md","text":"A8：重复点击、重试和并发请求不重复创建同一支付尝试；已取得订单号的所有失败均保留原订单；创建超时结果未知时保留待核实尝试，通过服务端可信关联恢复唯一匹配订单，无法确认时保持待核实且不自动再下单，不承诺平台不存在的幂等能力。"},{"id":"A9","source":"brief.md","text":"A9：伪造回跳/通知、错误订单归属、商户/项目/SKU/数量/金额/币种不匹配、无效渠道均不能触发错误入账；合法成功并发通知/查单仅入账一次，秘密和可用匿名查询凭据不泄露至前端、日志或错误正文。"},{"id":"A10","source":"brief.md","text":"A10：设置页可管理合法配置且密钥脱敏；禁用/错误配置安全失败；三数据库新建/升级/重复启动保持订单与余额完整；七语言、键盘操作、桌面和移动端状态完整，已有钱包支付及订单列表回归通过。"},{"id":"A11","source":"brief.md","text":"A11：平台CNY时，套餐卡片、原确认框及iDataRiver历史金额保留USD售价/到账额度，按有效平台显示汇率补人民币参考值，注明仅供参考、实际付款以渠道为准；USD及TOKENS/CUSTOM不附加人民币。来源缺失、非有限/非正/不可解析汇率或非有限乘积时保留USD并提示参考值暂不可用且不阻塞支付；正小额不得显示为0或把最小阈值冒充精确值。币种、汇率及语言切换同步更新；历史恢复按原USD快照及当前显示汇率；渠道实付的原币种、有效精度及未知提示保持，请求、SKU、quantity、订单价格、quota及结算/退款不受参考值影响。"}],"children":null,"formalHash":"4ff54df522e3c4d92169b0908aa28fd302f8c36d7c72c2ef4adb08e08b597397","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"469e9a9efc5d30cd38f6f675ab6519fc1335a