/REFUND/EXPIRED不可继续付，原链接失效不自动再建单。"},{"id":"A7","source":"brief.md","text":"A7：仅上游确认EXPIRED才展示过期并允许用户主动重新下单；尚无退款处理记录时，迟到DONE经完整核验可一次入账。REFUND在未入账时阻止后续入账；已入账时余额足够一次全额扣回，不足则不部分扣回、不透支并转manual_required；重复REFUND及任何已处理退款后迟到DONE均不再改变余额，manual_required不自动重扣；数据库失败整体回滚可重试。仅接收平台退款，不新增用户发起退款入口。"},{"id":"A8","source":"brief.md","text":"A8：重复点击、重试和并发请求不重复创建同一支付尝试；已取得订单号的所有失败均保留原订单；创建超时结果未知时保留待核实尝试，通过服务端可信关联恢复唯一匹配订单，无法确认时保持待核实且不自动再下单，不承诺平台不存在的幂等能力。"},{"id":"A9","source":"brief.md","text":"A9：伪造回跳/通知、错误订单归属、商户/项目/SKU/数量/金额/币种不匹配、无效渠道均不能触发错误入账；合法成功并发通知/查单仅入账一次，秘密和可用匿名查询凭据不泄露至前端、日志或错误正文。"},{"id":"A10","source":"brief.md","text":"A10：设置页可管理合法配置且密钥脱敏；禁用/错误配置安全失败；三数据库新建/升级/重复启动保持订单与余额完整；七语言、键盘操作、桌面和移动端状态完整，已有钱包支付及订单列表回归通过。"},{"id":"A11","source":"brief.md","text":"A11：平台CNY时，套餐卡片、原确认框及iDataRiver历史金额保留USD售价/到账额度，按有效平台显示汇率补人民币参考值，注明仅供参考、实际付款以渠道为准；USD及TOKENS/CUSTOM不附加人民币。来源缺失、非有限/非正/不可解析汇率或非有限乘积时保留USD并提示参考值暂不可用且不阻塞支付；正小额不得显示为0或把最小阈值冒充精确值。币种、汇率及语言切换同步更新；历史恢复按原USD快照及当前显示汇率；渠道实付的原币种、有效精度及未知提示保持，请求、SKU、quantity、订单价格、quota及结算/退款不受参考值影响。"}],"children":null,"formalHash":"4ff54df522e3c4d92169b0908aa28fd302f8c36d7c72c2ef4adb08e08b597397","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"469e9a9efc5d30cd38f6f675ab6519fc1335a7b65ea99135ea254e550d2b9c33","contractHash":"386a962eb88b768df9a5c20bd705e2a4425a7b3d8cd254c672db3b963874d54b","inputHash":"e23d696627bd3181095dfac6ae6ec02ead04a0f6b6348ad9e7f1543ee0609127","legacyFingerprint":"37fdbb95524588eaf26b2bfcc57c401c7a05823f035edd7c651c3bc0c98c8d5f","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"99b422da30b65192ccc2aa0c6c3ea70eb2ebb9f34e0adedbe1a1a8958d341a37","contractHash":"a66db77720e412e9269d92ffc4e22fec516ae1e5b1ae26bd06c3d577c9eca59a","inputHash":"561a2a0b75266a2110f26e4abe701d6b78fc57c6a5a635cfee4bf02dafd585e2","legacyFingerprint":"e35a734898a8ec8af439ba4cf3a5acf8f0d0