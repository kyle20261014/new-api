aRiver历史金额保留USD售价/到账额度，按有效平台显示汇率补人民币参考值，注明仅供参考、实际付款以渠道为准；USD及TOKENS/CUSTOM不附加人民币。来源缺失、非有限/非正/不可解析汇率或非有限乘积时保留USD并提示参考值暂不可用且不阻塞支付；正小额不得显示为0或把最小阈值冒充精确值。币种、汇率及语言切换同步更新；历史恢复按原USD快照及当前显示汇率；渠道实付的原币种、有效精度及未知提示保持，请求、SKU、quantity、订单价格、quota及结算/退款不受参考值影响。"}],"children":null,"formalHash":"4ff54df522e3c4d92169b0908aa28fd302f8c36d7c72c2ef4adb08e08b597397","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"469e9a9efc5d30cd38f6f675ab6519fc1335a7b65ea99135ea254e550d2b9c33","contractHash":"386a962eb88b768df9a5c20bd705e2a4425a7b3d8cd254c672db3b963874d54b","inputHash":"e23d696627bd3181095dfac6ae6ec02ead04a0f6b6348ad9e7f1543ee0609127","legacyFingerprint":"37fdbb95524588eaf26b2bfcc57c401c7a05823f035edd7c651c3bc0c98c8d5f","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"99b422da30b65192ccc2aa0c6c3ea70eb2ebb9f34e0adedbe1a1a8958d341a37","contractHash":"a66db77720e412e9269d92ffc4e22fec516ae1e5b1ae26bd06c3d577c9eca59a","inputHash":"561a2a0b75266a2110f26e4abe701d6b78fc57c6a5a635cfee4bf02dafd585e2","legacyFingerprint":"e35a734898a8ec8af439ba4cf3a5acf8f0d0b60c56893b702939d45a4bf297a5","source":"specs/idatariver-wallet/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"9b3fb5cd7b1f604957af78fa0f9059b467ccc1d772b909e5b412ed5d53bd1cd6","specChanges":[{"capability":"idatariver-wallet","operation":"create","source":"specs/idatariver-wallet/spec.md"}]}}},"proposalHash":"9d58cba1d4bfa0ea1071919f5b34052e3ec71a9a3e6996ee743cf3231d5a0762","choices":["approved","rejected"],"results":{},"decision":{"id":"bf462d0fb0f0df0150e154156c1826fa6f52cc79c8cd7385c41da9475f12c37c","choice":"approved","proposalHash":"9d58cba1d4bfa0ea1071919f5b34052e3ec71a9a3e6996ee743cf3231d5a0762"}},{"id":"idatariver-wallet-payment:32","stepId":"verify.stop","sequence":32,"status":"resolved","proposal":{"input":{"artifactRootRef":