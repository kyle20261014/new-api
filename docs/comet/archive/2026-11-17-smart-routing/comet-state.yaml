smart-routing","specCount":1,"stateVersion":33,"transactionId":"1a72e6ef-26ca-473d-af08-08aacc2b21bc"},{"sequence":10,"value":{"reason":"用户已明确缩定范围：不处理非本次任务引入的既有问题，不扩展旧Key通用Task耐久提交；只用当前本机及本change现有隔离资源验证，不要求新增测试或预发布环境。本轮功能及自身回归仍须完成，正式启用的共享DB权威、历史核账、旧写节点隔离、容量与回退门禁不豁免；保留已有实现和按版本范围有效证据。按同一Native Run更新完整正式Shape并重新绑定。"}},{"sequence":12,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"smart-routing"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：新建Key在分组前出现路由模式，默认智能路由→综合最优；固定分组仍单选；五项智能策略齐全。"},{"id":"A2","source":"brief.md","text":"A2：对既有固定、空group继承、Auto继承/显式空/有序列表及失效项，读取并只改名称保存不会改变任何路由字段或行为；缺省routing更新不迁移旧Key。"},{"id":"A3","source":"brief.md","text":"A3：四动态只用当前获权且支持模型的业务组，模型/分组排除均生效，新获权组自动参加并提示，撤权/候选清空不扩权。"},{"id":"A4","source":"brief.md","text":"A4：自定义按模型白名单与每模型四策略/手动顺序执行；未配置模型拒绝，API空模型/空组/重复和递归策略阻止保存；UI清空移除该模型，不留空壳，全部清空阻止下一步/保存，两步往返保留有效草稿。"},{"id":"A5","source":"brief.md","text":"A5：候选支持搜索、四分类、健康筛选/健康批选、当前模型清空、价格复制和已选清单；清空不影响其他模型，可重新添加；筛选不丢选项，撤权项标失效并阻止伪保存。"},{"id":"A6","source":"brief.md","text":"A6：候选展示当前用户生效输入/输出/缓存或按次/秒等价格和单位；特殊userGroup倍率优先、零价保留、异计价/未知参数不伪称最低，预估与实际结算区分。"},{"id":"A7","source":"brief.md","text":"A7：手动顺序支持拖拽和键盘上下移动、首尾禁用；单候选不跨业务组；组内保priority/weight，失败/拥堵跳转不越出清单；合法prefer命中优先于manual及四动态评分，off每新请求择优。"},{"id":"A8","source":"brief.md","text":"A8：HTTP首选/重试、Task Plugin原生/共享协议、Realtime、Responses WebSocket和Midjourney全部真实入口复用同一新策略边界；普通attempt按物理Channel去重，origin明确允许的同渠道换key例外也计全局预算；粘性发送也占预算，绑定含实际组+Channel，跨组共用Channel不偷换收费组；deadline不因切组重置。"},{"id":"A9","source":"brief.md","text":"A9：仅明确安全错误可回退；流式首次输出后不拼接新组，WebSocket上游会话建立后不切；新智能异步初始预留/operation/prepared同事务，sending在其耐久提交后CAS；accepted/unknown持久恢复明确，不重建/不盲退；无本地Task也能以submission_id在既有列表/详情跟踪，origin/pin/strict不被绕过。旧Key通用Task既有异常资金行为不在本轮扩围，本次新增回归仍须修复。"},{"id":"A10","source":"brief.md","text":"A10：便宜/免费组切贵组时，按最终组定价与userGroup特殊倍率核验并原子补预留；额度不足不发上游；钱包/有限Key/原支持的订阅/阶梯/图片数量/任务含MJ路径结算退款幂等，覆盖入库失败、断线、重复回调、崩溃恢复及同账户新旧Key并发；余额统一DB权威、pending batch未排空阻止启用。禁止负数/溢出扣费；估算不能承诺实际超用量永不欠费。"},{"id":"A11","source":"brief.md","text":"A11：软健康“仍尝试”仅对自定义已选候选生效；管理员禁用、撤权、模型能力、IP、限流、pin和预算仍硬拒绝，全部软下线默认返回无健康候选；prefer软下线才允许合法安全重选，strict拒绝时保原绑定、不借探测换组/Channel。"},{"id":"A12","source":"brief.md","text":"A12：真实attempt数据按模型/组/协议/provider/operation完整K及stage/Channel采集，桶/lease/评分/健康折叠一致；提交失败与终态分开，不混provider速度，重复结果不重复累计；1h/24h、时效/缺失准确，旧整请求数据不充新健康。"},{"id":"A13","source":"brief.md","text":"A13：综合权重20/40/25/15、四动态排名、归一化、最少样本、过期/冷启动/全无样本降级与价格不可比行为符合smart-routing-v1并公开。"},{"id":"A14","source":"brief.md","text":"A14：短时失败/429触发60s/5min避让和30–120s冷却，跨实例事件按DB应用顺序、成功打断连续失败，事件去重/过期/epoch与原子半开claim正确；异步提交与终态probe分离，受理不充终态成功，耐久关联/观察者接管/24h有界租约/unknown及迟到结果安全；真实active与限流信号驱动拥堵，不把分钟计数当连续序列或伪造上游队列。"},{"id":"A15","source":"brief.md","text":"A15：综合近同分按公开权重分摊，严格优先模式不为分流打乱主排序；固定输入排序稳定、请求种子可复核，多实例计数租约过期无永久拥堵。"},{"id":"A16","source":"brief.md","text":"A16：只由已保存当前模式生效；隐藏草稿不参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy；TTL过期/撤权/排除/禁用后的prefer重选与strict明确拒绝、SwitchOnSuccess绑定更新均符合合同，智能命名空间不污染legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，容量报告绑定实际配置、负载和窗口，不外推生产。旧batch finished/空map不能当排空，旧节点写权限须部署隔离；未完成30min稳定验证或缺历史/部署证据不计通过，超70%实测稳定容量上限不得启用；旧schema不隐式迁移策略。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"12e4db1c211313095fa402febe973f3b1f8133f3223a1b2ce46438e9b3fddece","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"38da1690eb5f3c1bc6699b7f6e01555ea6da999a0b90f317dc9bd0b87c15854d","contractHash":"8160da2ce3197a855182a53b7d6ad51e3158fa47d11987f5db1c2e8989882769","inputHash":"a1a86c6cf711243943bc328e01f8830f2f82328dbd4d2b0c72a9ccd5e6486168","legacyFingerprint":"350c1443cfe31f9f9c071f613f5b7cf7ecffb664a52f3274c5b66041e755c015","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"486696a843c27001fa6730ed3bedb0f02b0b79a2a6fc9490c7fba2a6ff826b32","contractHash":"797ea7aeb6440bc8162119c45c4eee10cdc0235ccf639d5e93631619b6e8660b","inputHash":"342474117ab269b31555a4d7cbdabfdf44fb68a7aa0cb5229586a4da1c5fdce3","legacyFingerprint":"b7a81f72ba018901182a2544c7ca40f872e7223f1676d1d507d5df84af0b2328","source":"specs/smart-routing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"ffb603b2026a39360b95d9ffe5eb9ed7b6e78a9a003ae2383ce1f5583ff3138a","specChanges":[{"capability":"smart-routing","operation":"create","source":"specs/smart-routing/spec.md"}]}}}}},{"sequence":11,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：新建Key在分组前出现路由模式，默认智能路由→综合最优；固定分组仍单选；五项智能策略齐全。"},{"id":"A2","source":"brief.md","text":"A2：对既有固定、空group继承、Auto继承/显式空/有序列表及失效项，读取并只改名称保存不会改变任何路由字段或行为；缺省routing更新不迁移旧Key。"},{"id":"A3","source":"brief.md","text":"A3：四动态只用当前获权且支持模型的业务组，模型/分组排除均生效，新获权组自动参加并提示，撤权/候选清空不扩权。"},{"id":"A4","source":"brief.md","text":"A4：自定义按模型白名单与每模型四策略/手动顺序执行；未配置模型拒绝，API空模型/空组/重复和递归策略阻止保存；UI清空移除该模型，不留空壳，全部清空阻止下一步/保存，两步往返保留有效草稿。"},{"id":"A5","source":"brief.md","text":"A5：候选支持搜索、四分类、健康筛选/健康批选、当前模型清空、价格复制和已选清单；清空不影响其他模型，可重新添加；筛选不丢选项，撤权项标失效并阻止伪保存。"},{"id":"A6","source":"brief.md","text":"A6：候选展示当前用户生效输入/输出/