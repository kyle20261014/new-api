估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，容量报告绑定实际配置、负载和窗口，不外推生产。旧batch finished/空map不能当排空，旧节点写权限须部署隔离；未完成30min稳定验证或缺历史/部署证据不计通过，超70%实测稳定容量上限不得启用；旧schema不隐式迁移策略。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"12e4db1c211313095fa402febe973f3b1f8133f3223a1b2ce46438e9b3fddece","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"38da1690eb5f3c1bc6699b7f6e01555ea6da999a0b90f317dc9bd0b87c15854d","contractHash":"8160da2ce3197a855182a53b7d6ad51e3158fa47d11987f5db1c2e8989882769","inputHash":"a1a86c6cf711243943bc328e01f8830f2f82328dbd4d2b0c72a9ccd5e6486168","legacyFingerprint":"350c1443cfe31f9f9c071f613f5b7cf7ecffb664a52f3274c5b66041e755c015","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"486696a843c27001fa6730ed3bedb0f02b0b79a2a6fc9490c7fba2a6ff826b32","contractHash":"797ea7aeb6440bc8162119c45c4eee10cdc0235ccf639d5e93631619b6e8660b","inputHash":"342474117ab269b31555a4d7cbdabfdf44fb68a7aa0cb5229586a4da1c5fdce3","legacyFingerprint":"b7a81f72ba018901182a2544c7ca40f872e7223f1676d1d507d5df84af0b2328","source":"specs/smart-routing/spec.md"}],"schema":"com