禁止负数/溢出扣费；估算不能承诺实际超用量永不欠费。"},{"id":"A11","source":"brief.md","text":"A11：软健康“仍尝试”仅对自定义已选候选生效；管理员禁用、撤权、模型能力、IP、限流、pin和预算仍硬拒绝，全部软下线默认返回无健康候选；prefer软下线才允许合法安全重选，strict拒绝时保原绑定、不借探测换组/Channel。"},{"id":"A12","source":"brief.md","text":"A12：真实attempt数据按模型/组/协议/provider/operation完整K及stage/Channel采集，桶/lease/评分/健康折叠一致；提交失败与终态分开，不混provider速度，重复结果不重复累计；1h/24h、时效/缺失准确，旧整请求数据不充新健康。"},{"id":"A13","source":"brief.md","text":"A13：综合权重20/40/25/15、四动态排名、归一化、最少样本、过期/冷启动/全无样本降级与价格不可比行为符合smart-routing-v1并公开。"},{"id":"A14","source":"brief.md","text":"A14：短时失败/429触发60s/5min避让和30–120s冷却，跨实例事件按DB应用顺序、成功打断连续失败，事件去重/过期/epoch与原子半开claim正确；异步提交与终态probe分离，受理不充终态成功，耐久关联/观察者接管/24h有界租约/unknown及迟到结果安全；真实active与限流信号驱动拥堵，不把分钟计数当连续序列或伪造上游队列。"},{"id":"A15","source":"brief.md","text":"A15：综合近同分按公开权重分摊，严格优先模式不为分流打乱主排序；固定输入排序稳定、请求种子可复核，多实例计数租约过期无永久拥堵。"},{"id":"A16","source":"brief.md","text":"A16：只由已保存当前模式生效；隐藏草稿不参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy；TTL过期/撤权/排除/禁用后的prefer重选与strict明确拒绝、SwitchOnSuccess绑定更新均符合合同，智能命名空间不污染legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；旧batch finished/空map不能当排空，旧节点写权限须部署隔离；同步DB容量报告绑定环境，超70%实测稳定容量上限不得启用；旧schema不隐式迁移策略。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children