2","source":"brief.md","text":"A2：对既有固定、空group继承、Auto继承/显式空/有序列表及失效项，读取并只改名称保存不会改变任何路由字段或行为；缺省routing更新不迁移旧Key。"},{"id":"A3","source":"brief.md","text":"A3：四动态只用当前获权且支持模型的业务组，模型/分组排除均生效，新获权组自动参加并提示，撤权/候选清空不扩权。"},{"id":"A4","source":"brief.md","text":"A4：自定义按模型白名单与每模型四策略/手动顺序执行；未配置模型拒绝，API空模型/空组/重复和递归策略阻止保存；UI清空移除该模型，不留空壳，全部清空阻止下一步/保存，两步往返保留有效草稿。"},{"id":"A5","source":"brief.md","text":"A5：候选支持搜索、四分类、健康筛选/健康批选、当前模型清空、价格复制和已选清单；清空不影响其他模型，可重新添加；筛选不丢选项，撤权项标失效并阻止伪保存。"},{"id":"A6","source":"brief.md","text":"A6：候选展示当前用户生效输入/输出/缓存或按次/秒等价格和单位；特殊userGroup倍率优先、零价保留、异计价/未知参数不伪称最低，预估与实际结算区分。"},{"id":"A7","source":"brief.md","text":"A7：手动顺序支持拖拽和键盘上下移动、首尾禁用；单候选不跨业务组；组内保priority/weight，失败/拥堵跳转不越出清单；合法prefer命中优先于manual及四动态评分，off每新请求择优。"},{"id":"A8","source":"brief.md","text":"A8：HTTP首选/重试、Task Plugin原生/共享协议、Realtime、Responses WebSocket和Midjourney全部真实入口复用同一新策略边界；普通attempt按物理Channel去重，origin明确允许的同渠道换key例外也计全局预算；粘性发送也占预算，绑定含实际组+Channel，跨组共用Channel不偷换收费组；deadline不因切组重置。"},{"id":"A9","source":"brief.md","text":"A9：仅明确安全错误可回退；流式首次输出后不拼接新组，WebSocket上游会话建立后不切；新智能异步初始预留/operation/prepared同事务，sending在其耐久提交后CAS；accepted/unknown持久恢复明确，不重建/不盲退；无本地Task也能以submission_id在既有列表/详情跟踪，origin/pin/strict不被绕过。旧Key通用Task既有异常资金行为不在本轮扩围，本次新增回归仍须修复。"},{"id":"A10","source":"brief.md","text":"A10：便宜/免费组切贵组时，按最终组定价与userGroup特殊倍率核验并原子补预留；额度不足不发上游；钱包/有限Key/原支持的订阅/阶梯/图片数量/任务含MJ路径结算退款幂等，覆盖入库失败、断线、重复回调、崩溃恢复及同账户新旧Key并发；余额统一DB权威、pending batch未排空阻止启用。禁止负数/溢出扣费；估算不能承诺实际超用量永不欠费。"},{"id":"A11","source":"brief.md","text":"A11：软健康“仍尝试”仅对自定义已选候选生效；管理员禁用、撤权、模型能力、IP、限流、pin和预算仍硬拒绝，全部软下线默认返回无健康候选；prefer软下线才允许合法安全重选，strict拒绝时保原绑定、不借探测换组/Channel。"},{"id":"A12","source":"brief.md","text":"A12：真实attempt数据按模型/组/协议/provider/operation完整K及stage/Channel采集，桶/lease/评分/健康折叠一致；提交失败与终态分开，不混provider速度，重复结果不重复累计；1h/24h、时效/缺失准确，旧整请求数据不充新健康。"},{"id":"A13","source":"brief.md","text":"A13：综合权重20/40/25/15、四动态排名、归一化、最少样本、过期/冷启动/全无样本降级与价格不可比行为符合smart-routing-v1并公开。"},{"id":"A14","source":"brief.md","text":"A14：短时失败/429触发60s/5min避让和30–120s冷却，跨实例事件按DB应用顺