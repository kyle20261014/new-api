径结算退款幂等，覆盖入库失败、断线、重复回调、崩溃恢复及同账户新旧Key并发；余额统一DB权威、pending batch未排空阻止启用。禁止负数/溢出扣费；估算不能承诺实际超用量永不欠费。"},{"id":"A11","source":"brief.md","text":"A11：软健康“仍尝试”仅对自定义已选候选生效；管理员禁用、撤权、模型能力、IP、限流、pin和预算仍硬拒绝，全部软下线默认返回无健康候选；prefer软下线才允许合法安全重选，strict拒绝时保原绑定、不借探测换组/Channel。"},{"id":"A12","source":"brief.md","text":"A12：真实attempt数据按模型/组/协议/provider/operation完整K及stage/Channel采集，桶/lease/评分/健康折叠一致；提交失败与终态分开，不混provider速度，重复结果不重复累计；1h/24h、时效/缺失准确，旧整请求数据不充新健康。"},{"id":"A13","source":"brief.md","text":"A13：综合权重20/40/25/15、四动态排名、归一化、最少样本、过期/冷启动/全无样本降级与价格不可比行为符合smart-routing-v1并公开。"},{"id":"A14","source":"brief.md","text":"A14：短时失败/429触发60s/5min避让和30–120s冷却，跨实例事件按DB应用顺序、成功打断连续失败，事件去重/过期/epoch与原子半开claim正确；异步提交与终态probe分离，受理不充终态成功，耐久关联/观察者接管/24h有界租约/unknown及迟到结果安全；真实active与限流信号驱动拥堵，不把分钟计数当连续序列或伪造上游队列。"},{"id":"A15","source":"brief.md","text":"A15：综合近同分按公开权重分摊，严格优先模式不为分流打乱主排序；固定输入排序稳定、请求种子可复核，多实例计数租约过期无永久拥堵。"},{"id":"A16","source":"brief.md","text":"A16：只由已保存当前模式生效；隐藏草稿不参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy；TTL过期/撤权/排除/禁用后的prefer重选与strict明确拒绝、SwitchOnSuccess绑定更新均符合合同，智能命名空间不污染legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，旧schema不隐式迁移策略。已有容量报告绑定实际配置、负载和窗口，失败/未测如实列出，不追加阶梯和长窗，PG30分钟未完成不阻止本轮交接；已观察400额度差异须归因，本次回归须修复并定向验证。历史核账、旧节点隔离、禁混部和真实部署容量缺证独立列为正式启用限制，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，预计峰值超70%实测稳定容量上限不得启用。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"a1c57a45d63fc01ccf25872b14871a91e815090fddb66729f9da28a2d2d21155","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"81cf6cb2a08edb75dfe7107262121e97243dde272327bbfad56668d0954dcfb8","contractHash":"90a481188197fa715f8398a2e4c5940eece041da55931484ff37f0fa42f1c89d","inputHash":"787c891147bd0febba46f09c3da9a4ad43c8aeaa5844689a2fa335a29f3104ce","legacyFingerprint":"1221ff582d0700f604f14df11b3ce61b2b428d8f433b3745b6d11392241a557a","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"e096a6baaab0f9d6663a6ba9a35d8648e697041c3c414b04a63523f89ec30c89","contractHash":"f4eaf33535a804194d8161078af76688d575622540d17b0996b6bb63aaf7098b","inputHash":"eff64e1590e38c9f4e54291678077fa2ce77ffe8d4cfb18aa44b34fb2af2b6ab","legacyFingerprint":"a6b8be3dd134294b34de4b5fe6c9c9e6b466defd856f5d8712f82c8b00a8c650","source":"specs/smart-routing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"8cd06055ae241b0f29b99a4721a1ee4463a6cac351bfbfff0d17975ff41ad65b","specChanges":[{"capability":"smart-routing","operation":"create","source":"specs/smart-routing/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：新建Key在分组前出现路由模式，默认智能路由→综合最优；固定分组仍单选；五项智能策略齐全。"},{"id":"A2","source":"brief.md","text":"A2：对既有固定、空group继承、Auto继承/显式空/有序列表及失效项，读取并只改名称保存不会改变任何路由字段或行为；缺省routing更新不迁移旧Key。"},{"id":"A3","source":"brief.md","text":"A3：四动态只用当前获权且支持模型的业务组，模型/分组排除均生效，新获权组自动参加并提示，撤权/候选清空不扩权。"},{"id":"A4","source":"brief.md","text":"A4：自定义按模型白名单与每模型四策略/手动顺序执行；未配置模型拒绝，API空模型/空组/重复和递归策略阻止保存；UI清空移除该模型，不留空壳，全部清空阻止下一步/保存，两步往返保留有效草稿。"},{"id":"A5","source":"brief.md","text":"A5：候选支持搜索、四分