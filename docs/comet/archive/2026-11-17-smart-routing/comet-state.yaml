e":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，旧schema不隐式迁移策略。已有容量报告绑定实际配置、负载和窗口，失败/未测如实列出，不追加阶梯和长窗，PG30分钟未完成不阻止本轮交接；已观察400额度差异须归因，本次回归须修复并定向验证。历史核账、旧节点隔离、禁混部和真实部署容量缺证独立列为正式启用限制，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，预计峰值超70%实测稳定容量上限不得启用。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"a1c57a45d63fc01ccf25872b14871a91e815090fddb66729f9da28a2d2d21155","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"81cf6cb2a08edb75dfe7107262121e97243dde272327bbfad56668d0954dcfb8","contractHash":"90a481188197fa715f8398a2e4c5940eece041da55931484ff37f0fa42f1c89d","inputHash":"787c891147bd0febba46f09c3da9a4ad43c8aeaa5844689a2fa335a29f3104ce","legacyFingerprint":"1221ff582d0700f604f14df11b3ce61b2b428d8f433b3745b6d11392241a557a","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"e096a6baaab0f9d6663a6ba9a35d8648e697041c3c414b04a63523f89ec30c89","contractHash":"f4eaf33535a804194d8161078af76688d575622540d17b0996b6bb63aaf7098b","inputHash":"eff64e1590e38c9f4e54291678077fa2ce77ffe8d4cfb18aa44b34fb2af