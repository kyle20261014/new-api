art-routing:45":{"results":{},"sequence":45},"smart-routing:46":{"results":{},"sequence":46},"smart-routing:47":{"results":{},"sequence":47},"smart-routing:5":{"results":{},"sequence":5},"smart-routing:7":{"results":{},"sequence":7},"smart-routing:8":{"results":{},"sequence":8}},"waits":[{"id":"smart-routing:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"smart-routing"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：新建Key在分组前出现路由模式，默认智能路由→综合最优；固定分组仍单选；五项智能策略齐全。"},{"id":"A2","source":"brief.md","text":"A2：对既有固定、空group继承、Auto继承/显式空/有序列表及失效项，读取并只改名称保存不会改变任何路由字段或行为；缺省routing更新不迁移旧Key。"},{"id":"A3","source":"brief.md","text":"A3：四动态只用当前获权且支持模型的业务组，模型/分组排除均生效，新获权组自动参加并提示，撤权/候选清空不扩权。"},{"id":"A4","source":"brief.md","text":"A4：自定义按模型白名单与每模型四策略/手动顺序执行；未配置模型拒绝，空模型/空组/重复和递归策略阻止保存，两步往返保留草稿。"},{"id":"A5","source":"brief.md","text":"A5：候选支持搜索、四分类、健康筛选/健康批选、当前模型清空、价格复制和已选清单；筛选不丢选项，撤权项标失效并阻止伪保存。"},{"id":"A6","source":"brief.md","text":"A6：候选展示当前用户生效输入/输出/缓存或按次/秒等价格和单位；特殊userGroup倍率优先、零价保留、异计价/未知参数不伪称最低，预估与实际结算区分。"},{"id":"A7","source":"brief.md","text":"A7：手动顺序支持拖拽和键盘上下移动、首尾禁用；单候选不跨业务组；组内保priority/weight，失败/拥堵跳转不越出清单。"},{"id":"A8","source":"brief.md","text":"A8：HTTP首选/重试、Task Plugin原生/共享协议、Realtime、Responses WebSocket和Midjourney全部真实入口复用同一新策略边界；普通attempt按物理Channel去重，origin明确允许的同渠道换key例外也计全局预算；deadline不因切组重置。"},{"id":"A9","source":"brief.md","text":"A9：仅明确安全错误可回退；流式首次输出后不拼接新组，WebSocket上游会话建立后不切；异步not_sent/rejected/accepted/unknown及持久提交凭据明确，受理后追踪原任务、受理不明不重建/不盲退；origin/pin/strict语义不被绕过。"},{"id":"A10","source":"brief.md","text":"A10：便宜/免费组切贵组时，按最终组定价与userGroup特殊倍率核验并原子补预留；额度不足不发上游；钱包/有限Key/原支持的订阅/阶梯/图片数量/任务含MJ路径结算退款幂等，覆盖入库失败、断线、重复回调、崩溃恢复及同账户新旧Key并发；余额统一DB权威、pending batch未排空阻止启用。禁止负数/溢出扣费；估算不能承诺实际超用量永不欠费。"},{"id":"A11","source":"brief.md","text":"A11：软健康“仍尝试”仅对自定义已选候选生效；管理员禁用、撤权、模型能力、IP、限流、pin和预算仍硬拒绝，全部软下线默认返回无健康候选。"},{"id":"A12","source":"brief.md","text":"A12：真实attempt数据按模型/组/物理Channel和协议口径采集，提交失败与终态分开，重复结果不重复累计；卡片1h与排名24h、样本数/时效/缺失状态准确，旧整请求数据不充新健康。"},{"id":"A13","source":"brief.md","text":"A13：综合权重20/40/25/15、四动态排名、归一化、最少样本、过期/冷启动/全无样本降级与价格不可比行为符合smart-routing-v1并公开。"},{"id":"A14","source":"brief.md","text":"A14：短时失败/429触发60s/5min避让和30–120s冷却，恢复探测有并发上限；真实active与限流信号驱动拥堵，不把未知上游队列伪装为已知。"},{"id":"A15","source":"brief.md","text":"A15：综合近同分按公开权重分摊，严格优先模式不为分流打乱主排序；固定输入排序稳定、请求种子可复核，多实例计数租约过期无永久拥堵。"},{"id":"A16","source":"brief.md","text":"A16：只由已保存当前模式生效；隐藏草稿不参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用，复用已有业务组件并留真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、事务失败回滚和迁移失败阻止启动；旧schema不做隐式迁移策略。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"9c07f41827068dd420fbebab56668923053db4aaefd139ebce20161432d46b7b","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"6c38a713dc9df26a593f28171b59acd8f21ed94272e39b3332f39b350116e604","contractHash":"c0a1f1a9d91023a795b1a0892573678069da8dea1a22dda875c07a70eca80fb2","inputHash":"cde149f48cc5addfee1e4ec66a31aba37e9b02ac0eb38e53148802a75edd692a","legacyFingerprint":"019f34ce9b477311218bb6b4f6ab97cb9574be07752c675b6b89e3d9aea20f32","source":"brief.md"},{"auxiliary":[],"commentsHash":"cd