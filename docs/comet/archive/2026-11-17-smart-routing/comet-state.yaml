口，失败/未测如实保留，不补跑阶梯或长窗，PG30分钟未完成不阻止本轮交接；已观察400额度差异须归因，本次回归须修复并定向验证，资金正确性未证明仍阻塞。仅已证实非本次引入的限制可保留，未知不视为既有。历史核账、旧节点隔离、禁混部和实际部署容量缺证独立披露，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，原容量声明边界不因取消压测视为已满足。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"39e163bad4bf609dd9bdd3b5ee5688649b7e5d9e7b7f4de22b01fbd36e78e86a","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"a53b08523290f7e28ab1293e08520a7eb1a72db4fb0cbb5dfae1c250ad6f1fe0","contractHash":"4b4d6c784af6b3abf0c1066aacd070c21cb41b788330fbed745060b2f15c817d","inputHash":"6234cf81b0843981657cfb75eeb3c77e0de80086cc1fe2a40249630d5a0b2521","legacyFingerprint":"fe2f957c798307b8424185b647bc90e528f41ebe691a3487b9ebbf50826727c4","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"f824e8cd2f1aeaed3e26c800da20217c977f73c84d6be6b02c0421166d91ab74","contractHash":"6468a0d9717c5bcb22a883a47f2d881a96d4b60ae52275a1845b349f53b9db3e","inputHash":"68986df703852267ca3be1c0cc2b39abc092366d7b427c527408075caeab341e","legacyFingerprint":"4c2b0a5df1e662167f8be2c0f13e7e2ca6a8d77619e03b75d42c44b9a4f5e0ea","source":"specs/smart-routing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"d6f16286b5ba7cc2f72ae9dcad707e3c9a8fe8d8bf34d12d7daf69d512dddd86","specChanges":[{"capability":"smart-routing","operation":"create","source":"specs/smart-routing/spec.md"}]}},{"sequence":2,"value":{"choice":"rejected","proposal":{"input":{"artifactRootRef":"docs","name":"smart-routing"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：新建Key在分组前出现路由模式，默认智能路由→综合最优；固定分组仍单选；五项智能策略齐全。"},{"id":"A2","source":"brief.md","text":"A2：对既有固定、空group继承、Auto继承/显式空/有序列表及失效项，读取并只改名称保存不会改变任何路由字段或行为；缺省routing更