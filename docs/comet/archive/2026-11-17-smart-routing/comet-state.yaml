近同分按公开权重分摊，严格优先模式不为分流打乱主排序；固定输入排序稳定、请求种子可复核，多实例计数租约过期无永久拥堵。"},{"id":"A16","source":"brief.md","text":"A16：只由已保存当前模式生效；隐藏草稿不参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy；TTL过期/撤权/排除/禁用后的prefer重选与strict明确拒绝、SwitchOnSuccess绑定更新均符合合同，智能命名空间不污染legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，旧schema不隐式迁移策略。本项目今后验收不做压测，既有容量报告绑定原配置/负载/窗口，失败/未测如实保留，不补跑阶梯或长窗，PG30分钟未完成不阻止本轮交接。400差异的现有归因和证据强弱完整披露；本次新增采集器造成且无法补回的历史终态缺证按用户批准列已知限制，仅这项缺证不阻塞候选及独立验收，保留失败和收费未知。当前实现缺陷、本次已确认回归仍须修复并作必要定向验证；其他未知产品问题不自动视为既有或获准保留。历史核账、旧节点隔离、禁混部和实际部署容量缺证独立披露，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，原容量声明边界不因取消压测视为已满足。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"a634108b081ddb077b3855caec8f4730f79c2d0e8bbc03fff7c103f90434c1ac","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"e8b3253e2003187f6e0dd461f7fd5437ea8d440ed6165329a59b99fb83fef7bd","contractHash":"644cc3be4f9933561464d2cce2af08446a4eb8fb03272829134cbc6289e4c31b","inputHash":"56e30cbfc8380151472024851583a3e169991ec36f4a9560853ecdf1d09311f2","legacyFingerprint":"88e73fec95ad03e9baaeabbec4506791f0c00180436