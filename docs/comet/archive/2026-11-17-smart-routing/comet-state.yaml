:"A12","source":"brief.md","text":"A12：真实attempt数据按模型/组/协议/provider/operation完整K及stage/Channel采集，桶/lease/评分/健康折叠一致；提交失败与终态分开，不混provider速度，重复结果不重复累计；1h/24h、时效/缺失准确，旧整请求数据不充新健康。"},{"id":"A13","source":"brief.md","text":"A13：综合权重20/40/25/15、四动态排名、归一化、最少样本、过期/冷启动/全无样本降级与价格不可比行为符合smart-routing-v1并公开。"},{"id":"A14","source":"brief.md","text":"A14：短时失败/429触发60s/5min避让和30–120s冷却，跨实例事件按DB应用顺序、成功打断连续失败，事件去重/过期/epoch与原子半开claim正确；异步提交与终态probe分离，受理不充终态成功，耐久关联/观察者接管/24h有界租约/unknown及迟到结果安全；真实active与限流信号驱动拥堵，不把分钟计数当连续序列或伪造上游队列。"},{"id":"A15","source":"brief.md","text":"A15：综合近同分按公开权重分摊，严格优先模式不为分流打乱主排序；固定输入排序稳定、请求种子可复核，多实例计数租约过期无永久拥堵。"},{"id":"A16","source":"brief.md","text":"A16：只由已保存当前模式生效；隐藏草稿不参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy；TTL过期/撤权/排除/禁用后的prefer重选与strict明确拒绝、SwitchOnSuccess绑定更新均符合合同，智能命名空间不污染legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，旧schema不隐式迁移策略。本项目今后验收不做压测，既有容量报告绑定原配置/负载/窗口，失败/未测如实保留，不补跑阶梯或长窗，PG30分钟未完成不阻止本轮交接。400差异的现有归因和证据强弱完整披露；本次新增采集器造成且无法补回的历史终态缺证按用户批准列已知限制，仅这项缺证不阻塞候选及独立验收，保留失败和收费未知。当前实现缺陷、本次已确认回归仍须修复并作必要定向验证；其他未知产品问题不自动视为既有或获准保留。历史核账、旧节点隔离、禁混部和实际部署容量缺证独立披露，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，原容量声明边界不因取消压测视为已满足。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/bu