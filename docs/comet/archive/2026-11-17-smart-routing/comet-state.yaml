sion_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，旧schema不隐式迁移策略。本项目今后验收不做压测，既有容量报告绑定原配置/负载/窗口，失败/未测如实保留，不补跑阶梯或长窗，PG30分钟未完成不阻止本轮交接。400差异的现有归因和证据强弱完整披露；本次新增采集器造成且无法补回的历史终态缺证按用户批准列已知限制，仅这项缺证不阻塞候选及独立验收，保留失败和收费未知。当前实现缺陷、本次已确认回归仍须修复并作必要定向验证；其他未知产品问题不自动视为既有或获准保留。历史核账、旧节点隔离、禁混部和实际部署容量缺证独立披露，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，原容量声明边界不因取消压测视为已满足。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"a634108b081ddb077b3855caec8f4730f79c2d0e8bbc03fff7c103f90434c1ac","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"e8b3253e2003187f6e0dd461f7fd5437ea8d440ed6165329a59b99fb83fef7bd","contractHash":"644cc3be4f9933561464d2cce2af08446a4eb8fb03272829134cbc6289e4c31b","inputHash":"56e30cbfc8380151472024851583a3e169991ec36f4a9560853ecdf1d09311f2","legacyFingerprint":"88e73fec95ad03e9baaeabbec4506791f0c00180436a2e15ec48e54af5a472ff","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"e68710d634318b55f291a64d958c645763404ced99ce55d60a03f54500cfc6d5","contractHash":"2920f3179f7c3d83f636b892b54bf935cb823d8c505fe7df8387b20aff77b061","inputHash":"1c8503b9fd8680d8cd05ed789eb969e90604d314b521f015e4d56a22ef4ca6a5","legacyFingerprint":"1fd26d8dce81eb1bf6eb977537a0447c510a55cefe6fa4a246d3958b9ad3a822","source":"specs/smart-routing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"dfd47f34c26bad4b30eee1411b0dfdb6ba4035b93368ac673c5a03182a0df9c8","specChanges":[{"capability":"smart-routing","operation":"create","source":"specs/smart-routing/spec.md"}]}}}}},{"sequence":32,"value":{"acceptance":[{"id":"A1","