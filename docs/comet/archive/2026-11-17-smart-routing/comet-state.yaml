缓存或按次/秒等价格和单位；特殊userGroup倍率优先、零价保留、异计价/未知参数不伪称最低，预估与实际结算区分。"},{"id":"A7","source":"brief.md","text":"A7：手动顺序支持拖拽和键盘上下移动、首尾禁用；单候选不跨业务组；组内保priority/weight，失败/拥堵跳转不越出清单。"},{"id":"A8","source":"brief.md","text":"A8：HTTP首选/重试、Task Plugin原生/共享协议、Realtime、Responses WebSocket和Midjourney全部真实入口复用同一新策略边界；普通attempt按物理Channel去重，origin明确允许的同渠道换key例外也计全局预算；deadline不因切组重置。"},{"id":"A9","source":"brief.md","text":"A9：仅明确安全错误可回退；流式首次输出后不拼接新组，WebSocket上游会话建立后不切；异步初始预留/operation/prepared同事务，sending在其耐久提交后CAS；accepted/unknown持久恢复明确，不重建/不盲退；无本地Task也能以submission_id在既有列表/详情跟踪，origin/pin/strict不被绕过。"},{"id":"A10","source":"brief.md","text":"A10：便宜/免费组切贵组时，按最终组定价与userGroup特殊倍率核验并原子补预留；额度不足不发上游；钱包/有限Key/原支持的订阅/阶梯/图片数量/任务含MJ路径结算退款幂等，覆盖入库失败、断线、重复回调、崩溃恢复及同账户新旧Key并发；余额统一DB权威、pending batch未排空阻止启用。禁止负数/溢出扣费；估算不能承诺实际超用量永不欠费。"},{"id":"A11","source":"brief.md","text":"A11：软健康“仍尝试”仅对自定义已选候选生效；管理员禁用、撤权、模型能力、IP、限流、pin和预算仍硬拒绝，全部软下线默认返回无健康候选。"},{"id":"A12","source":"brief.md","text":"A12：真实attempt数据按模型/组/协议/provider/operation完整K及stage/Channel采集，桶/lease/评分/健康折叠一致；提交失败与终态分开，不混provider速度，重复结果不重复累计；1h/24h、时效/缺失准确，旧整请求数据不充新健康。"},{"id":"A13","source":"brief.md","text":"A13：综合权重20/40/25/15、四动态排名、归一化、最少样本、过期/冷启动/全无样本降级与价格不可比行为符合smart-routing-v1并公开。"},{"id":"A14","source":"brief.md","text":"A14：短时失败/429触发60s/5min避让和30–120s冷却，跨实例事件按DB应用顺序、成功打断连续失败，事件去重/过期/epoch与原子半开claim正确；异步提交与终态probe分离，受理不充终态成功，耐久关联/观察者接管/24h有界租约/unknown及迟到结果安全；真实active与限流信号驱动拥堵，不把分钟计数当连续序列或伪造上游队列。"},{"id":"A15","source":"brief.md","text":"A15：综合近同分按公开权重分摊，严格优先模式不为分流打乱主排序；固定输入排序稳定、请求种子可复核，多实例计数租约过期无永久拥堵。"},{"id":"A16","source":"brief.md","text":"A16：只由已保存当前模式生效；隐藏草稿不参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；旧batch finished/空map不能当排空，旧节点写权限须部署隔离；同步DB容量报告绑定环境，超70%实测稳定容量上限不得启用；旧schema不隐式迁移策略。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"01cfa33437d58ea9f4581ccd02e4780e7cf3fd83a0a74d4df832093b314f98fd","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"4255a7593242c2cafa67b029d48e8b6d7d2c645f5016c339591a0d9051f9565b","contractHash":"5b92102b15d517646dd82776ff673479f2aa335cfd52952c136e71ec149b02d8","inputHash":"31f94addc54c4748a96d159604e8ec3cbbbbd12657f503778a0a1830c100a141","legacyFingerprint":"c52678c8ddb220c4e401eb49a54494c376b8a2c52889b4ed73ab373526fa4c89","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"cfc162074c16b5dc9fbcf11cb568d57c8e0dc70b54f239ec5f04797ffb8ba6ba","contractHash":"73edbdedc5612264da0e030ba16fc6bdb29bdda2c69c128353c533eadd2093cf","inputHash":"a3d6d2c9a1db9e72390d3afe95a0915cae375d5ba8ba159b77c5190f167b615a","legacyFingerprint":"ea6860ce6c16a17ed460970a9f49ad1af935d147e09d25b8ee0a93da3ebc372f","source":"specs/smart-routing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"4460e241d0c3a57e9010473ce95fde534b1abda4216ade8268eae8299eec3cf7","specChanges":[{"capability":"smart-routing","operation":"create","source":"specs/smart-routing/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：新建Key在分组前出