参与，取消不保存；并发CAS冲突明确409，权限/配置变更在下一次新发送前复核，DB故障不回落legacy；TTL过期/撤权/排除/禁用后的prefer重选与strict明确拒绝、SwitchOnSuccess绑定更新均符合合同，智能命名空间不污染legacy。"},{"id":"A17","source":"brief.md","text":"A17：首页/模型体验与Key配置共用策略说明/报价；临时策略只约束该次体验，不持久修改Key；显示首选预估/换贵和实际结算说明，不承诺永远最低或必成功。"},{"id":"A18","source":"brief.md","text":"A18：self GET仅当前Key；self PUT默认拒绝、控制台开启后仅能改自身路由；未知字段、改他Key/开自身写开关/提高额度均拒绝，IP/状态/归属/模型限制与限流持续生效。"},{"id":"A19","source":"brief.md","text":"A19：控制台管理保既有UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，旧schema不隐式迁移策略。本项目今后验收不做压测，既有容量报告绑定原配置/负载/窗口，失败/未测如实保留，不补跑阶梯或长窗，PG30分钟未完成不阻止本轮交接；已观察400额度差异须归因，本次回归须修复并定向验证，资金正确性未证明仍阻塞。仅已证实非本次引入的限制可保留，未知不视为既有。历史核账、旧节点隔离、禁混部和实际部署容量缺证独立披露，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，原容量声明边界不因取消压测视为已满足。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"39e163bad4bf609dd9bdd3b5ee5688649b7e5d9e7b7f4de22b01fbd36e78e86a","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"a53b08523290f7e28ab1293e08520a7eb1a72db4fb0cbb5dfae1c250ad6f1fe0","contractHash":"4b4d6c784af6b3abf0c1066aacd070c21cb41b788330fbed745060b2f15c817d","inputHash":"6234cf81b0843981657cfb75eeb3c77e0de80086cc1fe2a40249630d5a0b2521","legacyFingerprint":"fe2f957c798307b8424185b647bc90e528f41ebe691a3487b9ebbf50826727c4","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"f824e8cd2f1aeaed3e26c800da20217c977f73c84d6be6b02c0421166d91ab74","contractHash":"6468a0d9717c5bcb22a883a47f2d881a96d4b60ae52275a1845b349f53b9db3e","inputHash":"68986df703852267ca3be1c0cc2b39abc092366d7b427c527408075caeab341e","legacyFingerprint":"4c2b0a5df1e662167f8be2c0f13e7e2ca6a8d77619e03b75d42c44b9a4f5e0ea","source":"specs/smart-routing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"d6f16286b5ba7cc2f72ae9dcad707e3c9a8fe8d8bf34d12d7daf69d512dddd86","specChanges":[{"capability":"smart-routing","operation":"create","source":"specs/smart-routing/spec.md"}]},{"reason":"用户在2026-11-17群内对将本次新增采集器造成且无法补回的历史终态缺证列为已知限制、调整对应阻塞后继续独立验收明确回复同意。只解除这项历史缺证阻塞，不认定历史收费正确，不将未知产品问题认定既有，不豁免当前实现缺陷、完整功能及资金权限协议安全。保留Builder20/22失败和全部原始报告，今后验收不做压测。按组长要求先正式修订绑定，再提交候选与A1–A22映射供复核，暂不启动Verifier；无Git、accept、部署或清理授权。"},{"choice":"rejected","proposal":{"input":{"artifactRootRef":"docs","name":"smart-routing"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：新建Key在分组前出现路由模式，默认智能路由→综合最优；固定分组仍单选；五项智能策略齐全。"},{"id":"A2","source":"brief.md","text":"A2：对既有固定、空group继承、Auto继承/显式空/有序列表及失效项，读取并只改名称保存不会改变任何路由字段或行为；缺省routing更新不迁移旧Key。"},{"id":"A3","source":"brief.md","text":"A3：四动态只用当前获权且支持模型的业务组，模型/分组排除均生效，新获权组自动参加并提示，撤权/候选清空不扩权。"},{"id":"A4","source":"brief.md","text":"A4：自定义按模型白名单与每模型四策略/手动顺序执行；未配置模型拒绝，API空模型/空组/重复和递归策略阻止保存；UI清空移除该模型，不留空壳，全部清空阻止下一步/保存，两步往返保留有效草稿。"},{"id":"A5","source":"brief.md","text":"A5：候选支持搜索、四分类、健康筛选/健康批选、当前模型清空、价格复制和已选清单；清空不影响其他模型，可重新添加；筛选不丢选项，撤权项标失效并阻止伪保存。"},{"id":"A6","source":"brief.md","text":"A6：候选展示当前用户生效输入/输出/缓存或按次/秒等价格和单位；特殊userGroup倍率优先、零价保留、异计价/未知参数不伪称最低，预估与实际结算区分。"},{"id":"A7","source":"brief.md","text":"A7：手动顺序支持拖拽和键盘上下移动、首尾禁用；单候选不跨业务组；组内保priority/weight，失败/拥堵跳转不越出清单；合法prefer命中优先于manual及四动态评分，off每新请求择优。"},{"id":"A8","source":"brief.md","text":"A8：HTTP首选/重试、Task Plugin原生/共享协议、Realtime、Responses WebSocket和Midjourney全部真实入口复用同一新策略边界；普通attempt按物理Channel去重，origin明确允许的同渠道换key例外也计全局预算；粘性发送也占预算，绑定含实际组+Channel，跨组共用Channel不偷换收费组；deadline不因切组重置。"