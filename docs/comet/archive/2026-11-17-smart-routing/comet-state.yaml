UserAuth、适用Casbin和PAT api_key scope，普通用户不新增管理员门槛；self与管理认证不混淆；创建/修改/拒绝有脱敏审计，无凭据或内部地址泄漏，LOG_DB失败如实告警；删除/撤权与self并发不能复活旧策略，下一发送复核权威版本。"},{"id":"A20","source":"brief.md","text":"A20：七语言完整，手机/桌面、键盘/焦点/可访问名称、加载/空/错误/保存失败/冲突/失效候选状态可用；现有任务列表/详情显示submission_id、受理状态、预留及单位、更新时间与处理结果，不将unknown引导重建；有真实行为回归。"},{"id":"A21","source":"brief.md","text":"A21：真实SQLite/MySQL/PostgreSQL覆盖新库、旧库升级、重复启动、CAS并发、唯一约束、预留/prepared原子回滚和迁移阻启；验证仅使用当前本机及本change已建立的隔离资源，旧schema不隐式迁移策略。本项目今后验收不做压测，既有容量报告绑定原配置/负载/窗口，失败/未测如实保留，不补跑阶梯或长窗，PG30分钟未完成不阻止本轮交接。400差异的现有归因和证据强弱完整披露；本次新增采集器造成且无法补回的历史终态缺证按用户批准列已知限制，仅这项缺证不阻塞候选及独立验收，保留失败和收费未知。当前实现缺陷、本次已确认回归仍须修复并作必要定向验证；其他未知产品问题不自动视为既有或获准保留。历史核账、旧节点隔离、禁混部和实际部署容量缺证独立披露，不据此声称已满足启用条件；旧batch finished/空map不是排空证据，原容量声明边界不因取消压测视为已满足。"},{"id":"A22","source":"brief.md","text":"A22：所有验收由独立新Verifier完整判断，按版本/范围复用仍适用证据；根及两独立Go模块必要vet/build/test与前端typecheck/lint/受影响test/build、资金/协议/权限集成检查真实记录，未运行不算通过。"}],"children":null,"formalHash":"1db109bed50cddefe22149592837defda684f98e10aa0cd73e02396fa7f77d27","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"6d67fd693ce2deb96b9a5d2204ba07a9781ecfe8bc18a5e6b8112ef4e53a9648","contractHash":"d35358c41ee925f167461a1c7f14053166a06e91b5746c66bad82b7028e4dd5d","inputHash":"4b4bb7c2bb5e89c30e8f580a989cf6952ab10c263dc849b4f9c291d9a6b49b73","legacyFingerprint":"e52738c5c00b40c6bde731dfc8c1b621e450cd7045e977092852c16f6c2c172c","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"78edde7487c25a6758fc65ef050edfcb5214042c5e441a24f33f867437919240","contractHash":"d5b2ed6ec78e4373df48ec5eb69ec57d5eec274eb166394fe19be7c9c48842a8","inputHash":"196b9b09b83c0de3402dfc4a3f15edbd0423ee038fb3bd342be49bf44bdde172","legacyFingerprint":"d1b3e8e732874ba1588baf884aa3cb7acda3d8bd718acc1fa6d8c596558cd5e4","source":"specs/smart-routing/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeCon