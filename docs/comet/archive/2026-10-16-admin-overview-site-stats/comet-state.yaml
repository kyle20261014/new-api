acceptance:
  - id: A1
    source: brief.md
    text: 管理员和超级管理员进入概览页，在现有引导和个人摘要之前看到全站统计；普通用户不展示、不请求该数据，未登录和无管理员权限的直接接口调用被拒绝。
    result: passed
    reason:
      text: Independently traced overview placement, role-gated query, AdminAuth route
        and explicit session-only PAT rule. Runtime regressions pass for
        administrator/root sessions and
        ordinary/anonymous/invalid/expired/disabled/PAT rejection; frontend
        tests prove ordinary users and guests do not request stats. Live
        overview places statistics before onboarding and personal usage.
      truncated: false
  - id: A2
    source: brief.md
    text: 今日、本月按 Asia/Shanghai 的自然日和月初起点分别聚合至当前；跨日、跨月和月初边界正确，未来记录不计入。
    result: passed
    reason:
      text: GetDashboardStats generates Asia/Shanghai day/month starts server-side and
        caps completion/log times at now. Actual SQLite/MySQL/PostgreSQL
        regressions cover exact starts, prior day/month, future records, month
        start and January rollover with UTC input.
      truncated: false
  - id: A3
    source: brief.md
    text: 只有已成功完成的充值按完成时间计入充值入账；待支付、失效和失败订单不计入；支付渠道单位换算与现有钱包入账一致，订阅镜像不重复计入钱包充值。
    result: passed
    reason:
      text: "Successful TopUp orders are selected by complete_time, subscription trade
        numbers excluded, and per-order WalletQuotaFromDecimalStrict conversions
        match actual wallet credit paths: Stripe Money*QuotaPerUnit, Creem
        Amount as quota, other providers Amount*QuotaPerUnit. Real three-engine
        tests cover rounding, statuses and mirrors."
      truncated: false
  - id: A4
    source: brief.md
    text: 用户余额显示所有未删除用户的当前钱包余额总和，两组均标注当前；空数据为零，禁用但未删除用户仍计入。
    result: passed
    reason:
      text: Scoped User aggregate excludes soft-deleted users, retains disabled users,
        and COALESCE returns zero for empty sets. Three-engine fixtures verify
        these rules. Both UI groups use the same current_balance_quota and
        visible Current badge; live page shows identical current balances.
      truncated: false
  - id: A5
    source: brief.md
    text: 确认收入统计各区间内全站已记录消费额度，请求次数统计对应消费日志笔数且包含零费用调用、不含失败日志；界面简要解释消费记录口径与日志保留限制，不出现独立消费金额卡片。
    result: passed
    reason:
      text: Configured LOG_DB is queried for LogTypeConsume SUM(quota) and COUNT(*),
        including zero-charge and subscription consumption while excluding
        error/refund/top-up logs and future records. Separate-log decoy
        regression passes. UI has four requested metrics and explains
        recorded-consumption/log-retention limits without an independent
        consumption-amount card.
      truncated: false
  - id: A6
    source: brief.md
    text: 加载展示占位，失败展示真实错误和可重试入口，不能把失败伪装为零；窄屏不横向溢出，金额按现有设置显示且保留必要精度，数字随语言切换正确格式化，新增文案支持七种界面语言。
    result: passed
    reason:
      text: Reviewed shared StatCard/ErrorState/formatters, loading and real-error
        retry paths, six-decimal micro-charge precision, reactive currency
        subscription and toIntlLocale usage; checked added translations in all
        seven locale diffs. Runtime component tests cover loading, errors/retry,
        zero, $0.000002, currency updates and Chinese/French switching. Own live
        375x812 Chinese/French inspection shows no visible horizontal overflow
        and currency placement updates from $200 to 200 $.
      truncated: false
  - id: A7
    source: brief.md
    text: 后端统计行为在真实 SQLite、MySQL、PostgreSQL 实例通过；前端受影响回归、类型检查、lint 和生产构建通过。
    result: passed
    reason:
      text: "Reused current-candidate Runtime evidence: all seven checks exit 0,
        backend-regression on real SQLite 3.50.4/MySQL 8.0.46/PostgreSQL 16.15
        plus auth regressions, go build ./..., 82 frontend tests, typecheck,
        lint of all five affected TS/TSX files under the existing oxlint config,
        production build and git diff --check. No additional Runtime checks were
        needed."
      truncated: false
